# Copies the "wiki" folder of this repository to the repository's wiki.
# It uses the token GitHub gives every workflow run: no secret to create, nothing to configure.
# The wiki must exist first: open the Wiki tab once and save a first page (any content).
# Saving a page in the Wiki tab also starts this workflow, so the wiki always matches the "wiki" folder:
# edit the documentation in that folder, not in the Wiki tab.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/publish-wiki.yml"]
  gollum:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy wiki folder to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet --depth 1 "$url" published 2>/dev/null; then
            echo "::warning::The wiki does not exist yet. Open the Wiki tab, save a first page, then run this workflow again."
            exit 0
          fi
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki/. published/
          cd published
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Update wiki from ${GITHUB_SHA::7}"
          git push --quiet
          echo "Wiki published."
